<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="cabecalho">

        <h1>🏢 Administração do Condomínio</h1>

    </header>


    <main class="login-container">

        <section class="login-box">

            <h2>Acesso administrativo</h2>

            <p>Entre com os dados da conta administrativa.</p>


            <label for="usuario-admin">
                Usuário
            </label>

            <input
                type="text"
                id="usuario-admin"
                placeholder="Digite o usuário"
            >


            <label for="senha-admin">
                Senha
            </label>

            <input
                type="password"
                id="senha-admin"
                placeholder="Digite a senha"
            >


            <button
                type="button"
                class="botao-login"
                id="botao-admin"
            >
                Entrar
            </button>


            <a href="index.html" class="botao-secundario">
                Voltar
            </a>

        </section>

    </main>


    <script src="js/admin.js"></script>

</body>

</html>
