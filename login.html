<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema do Condominio</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="login-container">

        <div class="login-box">
            <h1>Sistema do Condominio</h1>

            <h2>Login</h2>

            <label for="apartamento">
                Apartamento
            </label>

            <input 
                type="text"
                id="apartamento"
                placeholder="Ex: 101"
            >

            <label for="senha">
                Senha
            </label>

            <input 
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >
            <button class="botao-login">
                
                Entrar

            </button>

        </div>
        
    </main>
    
    <script src="js/app.js"></script>
</body>
</html>
